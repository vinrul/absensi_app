[package]
name = "kinerja-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "API absensi dan penilaian kinerja personel Polda Bali"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = [
    "trace",
    "cors",
    "limit",
    "timeout",
    "request-id",
    "catch-panic",
    "compression-gzip",
    "set-header",
] }

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v5", "serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
mime = "0.3"
mime_guess = "2"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
