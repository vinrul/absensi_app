<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face { font-family: 'Brand'; src: local('Segoe UI'); }
			* { margin: 0; padding: 0; box-sizing: border-box; }
			html, body { width: 1024px; height: 500px; overflow: hidden; }
			body {
				position: relative;
				font-family: 'Segoe UI', Arial, sans-serif;
				background:
					radial-gradient(circle at 18% 25%, #16406d 0%, #0b2545 52%, #06182f 100%);
				color: #fff;
			}
			body::before {
				content: '';
				position: absolute;
				width: 560px;
				height: 560px;
				border-radius: 50%;
				border: 30px solid rgba(212, 160, 23, 0.13);
				top: -250px;
				right: -110px;
			}
			body::after {
				content: '';
				position: absolute;
				width: 340px;
				height: 340px;
				border-radius: 50%;
				border: 22px solid rgba(214, 226, 240, 0.07);
				bottom: -210px;
				left: 220px;
			}
			.konten {
				position: relative;
				z-index: 2;
				height: 100%;
				display: flex;
				align-items: center;
				gap: 40px;
				padding: 0 62px;
			}
			.logo {
				height: 330px;
				width: auto;
				flex-shrink: 0;
				filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
			}
			.instansi {
				color: #d4a017;
				font-size: 17px;
				font-weight: 700;
				letter-spacing: 7px;
				margin-bottom: 12px;
			}
			h1 {
				font-size: 86px;
				line-height: 0.98;
				font-weight: 800;
				letter-spacing: -1.5px;
				text-shadow: 0 6px 18px rgba(0, 0, 0, 0.32);
			}
			.sub {
				margin-top: 16px;
				color: #d6e2f0;
				font-size: 26px;
				font-weight: 400;
				line-height: 1.25;
			}
			.garis {
				width: 92px;
				height: 4px;
				border-radius: 2px;
				background: #d4a017;
				margin: 22px 0 18px;
			}
			.fitur {
				color: #9fb6d1;
				font-size: 18px;
				letter-spacing: 0.6px;
			}
		</style>
	</head>
	<body>
		<div class="konten">
			<img class="logo" src="../../logo_polda_bali.png" alt="Logo SIAP Bali" />
			<div class="teks">
				<p class="instansi">POLDA BALI</p>
				<h1>SIAP Bali</h1>
				<p class="sub">Sistem Informasi Absensi Personel Bali</p>
				<div class="garis"></div>
				<p class="fitur">Absensi GPS · Strong Point · Rekap Kehadiran</p>
			</div>
		</div>
	</body>
</html>
